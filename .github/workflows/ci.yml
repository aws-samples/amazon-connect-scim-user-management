name: CI

# Without this, none of the checks below run anywhere. The test suite includes a
# guard that the three deployments' handler copies have not drifted apart, and that
# guard is only meaningful if something executes it on every change.
on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to full commit SHAs, not tags. A tag is mutable, so
# whoever controls the action repository can change what a pinned tag resolves
# to; a SHA cannot be moved. The trailing comment records the human-readable
# version, which is what to bump when updating.
permissions:
  contents: read

jobs:
  lambda-handlers:
    name: Lambda handlers (pytest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest tests/unit -v
      - name: CloudFormation template
        run: cfn-lint CloudFormation/user_management_cloudformation.yaml

  cdk:
    name: CDK (build, tests, synth with cdk-nag)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk_source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # No package-lock.json is committed, so npm ci is unavailable and npm install
      # resolves the transitive graph. Direct dependencies are exact-pinned.
      - name: Install
        run: npm install --no-fund --no-audit
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest
      # cdk-nag runs during synth and fails it on any unacknowledged finding, so
      # this covers both identity providers.
      - name: Synth (okta)
        run: npx cdk synth --quiet
      - name: Synth (azure)
        run: npx cdk synth --quiet -c idp_type=azure

  terraform:
    name: Terraform (validate, fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
