AWSTemplateFormatVersion: 2010-09-09
Description: >-
  This template creates an APIGateway that is SCIM compliant to interface with SCIM AD
  sync for Amazon Connect auto provisioning of agents. The output is the API
  tenant URL to use in SCIM configuration. Creates API GW and Lambda function.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "SCIM Configuration on AWS"
        Parameters:
          - AmazonConnectInstanceId
          - ApiKeyLength
          - IdpType
          - DefaultRoutingProfile
      - Label:
          default: "Artifact details for Lambda function provisioning"
        Parameters:
          - CodeBucket
          - UserManagementCodeObject
          - AuthorizerCodeObject
          - APIKeyGenerationCodeObject

    ParameterLabels:
      AmazonConnectInstanceId:
        default: "Enter your Amazon Connect Instance Id"
      ApiKeyLength:
        default: "Enter the Length for the API key to be generated for lambda authorizer"
      IdpType:
        default: "The Idptype for user management , allowed values OKTA , Azure"
      CodeBucket:
        default: s3 bucket that cotains the Code for Lambda function provisioning
      UserManagementCodeObject:
        default: Zip file that contains the User management Lambda code.
      AuthorizerCodeObject:
        default: Zip file that contains the Lambda authorizer code.
      APIKeyGenerationCodeObject:
        default: Zip file that cotains the API Key for IDP Authorization Lambda code.
      DefaultRoutingProfile:
        default: The default routing profile that will be associated with the User provisioning

Parameters:
  AmazonConnectInstanceId:
    Type: String
    # This value is interpolated into the provisioning role's resource ARNs, so an
    # unconstrained string (e.g. "*") would widen the role to every Connect
    # instance in the account.
    AllowedPattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ConstraintDescription: Must be an Amazon Connect instance UUID.
  ApiKeyLength:
    Type: Number
    Default: 32
  IdpType:
    Type: String
    AllowedValues:
      - OKTA
      - AZURE
  CodeBucket:
    Type: String
  UserManagementCodeObject:
    Type: String
  AuthorizerCodeObject:
    Type: String
  APIKeyGenerationCodeObject:
    Type: String
  DefaultRoutingProfile:
    Type: String
    Default: "Basic Routing Profile"
  DefaultSecurityProfile:
    Type: String
    Default: "Agent"
    Description: Security profile assigned when the IdP supplies no entitlements.

Conditions:
  IdpCondition: !Or
    - !Equals [!Ref IdpType, "OKTA"]
    - !Equals [!Ref IdpType, "AZURE"]
  OktaCondition: !Equals [!Ref IdpType, "OKTA"]
  AzureCondition: !Equals [!Ref IdpType, "AZURE"]

################# Create Lambda Function ##########################################
Resources:
  SCIMProvisioningLambda:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-Provisioninglambda"
      Handler: user_management_lambda.lambda_handler
      Runtime: python3.14
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt SCIMProvisioningLambdaExecutionRole.Arn
      Description: AWS Lambda function for SCIM user provisioning
      Environment:
        Variables:
          INSTANCE_ID: !Ref AmazonConnectInstanceId
          DEFAULT_ROUTING_PROFILE: !Ref DefaultRoutingProfile
          DEFAULT_SECURITY_PROFILE: !Ref DefaultSecurityProfile
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref UserManagementCodeObject
    DependsOn:
      - SCIMProvisioningLambdaExecutionRole

  SCIMAuthorizerLambda:
    Condition: IdpCondition
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-Authorizerlambda"
      Handler: lambda_authorizer.lambda_handler
      Runtime: python3.14
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt SCIMAuthorizerLambdaExecutionRole.Arn
      Description: AWS Lambda Authorizer for SCIM user provisioning
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref AuthorizerCodeObject
      Environment:
        Variables:
          PARAMETER_NAME: /connect/scim-integration/api-token

  APIKeyGenerationLambda:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-Apikeylambda"
      Handler: custom_resource_lambda.lambda_handler
      Runtime: python3.14
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt BasicLambdaExecutionRole.Arn
      Description: Custom Resource to create the API Key
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref APIKeyGenerationCodeObject
      Environment:
        Variables:
          PARAMETER_NAME: /connect/scim-integration/api-token
          KMS_KEY_ID: !GetAtt APITokenKey.Arn
  ################################################################################

  SCIMAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      AuthorizerUri: !Join
        - ""
        - - "arn:"
          - Ref: AWS::Partition
          - ":apigateway:"
          - !Ref "AWS::Region"
          - ":lambda:path/2015-03-31/functions/"
          - !GetAtt
            - SCIMAuthorizerLambda
            - Arn
          - /invocations
      IdentitySource: method.request.header.Authorization
      Name: !Sub "${AWS::StackName}-SCIMAuthorizer"
      RestApiId: !Ref SCIMProvisioningAPIGW
      Type: TOKEN

  ################# Create API GW ##########################################
  SCIMAPIProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId:
        Fn::GetAtt:
          - SCIMProvisioningAPIGW
          - RootResourceId
      PathPart: "{Users+}"
      RestApiId:
        Ref: SCIMProvisioningAPIGW

  SCIMAPIMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: ANY
      ResourceId:
        Ref: SCIMAPIProxyResource
      RestApiId:
        Ref: SCIMProvisioningAPIGW
      RequestParameters:
        method.request.path.proxy: true
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref SCIMAuthorizer
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri:
          Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - ":apigateway:"
              - Ref: AWS::Region
              - ":lambda:path/2015-03-31/functions/"
              - !GetAtt SCIMProvisioningLambda.Arn
              - /invocations

  SCIMProvisioningAPIGW:
    Type: "AWS::ApiGateway::RestApi"
    Properties:
      Description: API GW invoked from SCIM Enterprise application and calls the Lambda function
      EndpointConfiguration:
        Types:
          - EDGE
      Name: !Sub "${AWS::StackName}-apigw"

  SCIMAPIAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-access-logs"
      # Access logs are the audit trail for authentication attempts against the
      # SCIM endpoint, so they are retained for a year.
      RetentionInDays: 365

  SCIMAPIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId:
        Ref: SCIMProvisioningAPIGW
      DeploymentId:
        Ref: SCIMProvisioningAPIGWdeployment
      StageName: dev
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt SCIMAPIAccessLogGroup.Arn
        # No caller identity and no headers, so the bearer token cannot reach the log.
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: ERROR
          MetricsEnabled: true
          # Data tracing writes full request and response bodies, including the
          # Authorization header, to CloudWatch.
          DataTraceEnabled: false
    DependsOn:
      - SCIMProvisioningAPIGWaccount

  SCIMProvisioningAPIGWaccount:
    Type: "AWS::ApiGateway::Account"
    Properties:
      CloudWatchRoleArn: !GetAtt
        - >-
          SCIMProvisioningAPIGWCloudWatchRole
        - Arn
    DependsOn:
      - SCIMProvisioningAPIGW

  SCIMProvisioningAPIGWdeployment:
    Type: "AWS::ApiGateway::Deployment"
    Properties:
      RestApiId: !Ref SCIMProvisioningAPIGW
      Description: Automatically created by the RestApi construct
    DependsOn:
      - SCIMAPIMethod
      - SCIMAPIProxyResource

  SCIMProvisioningAPIGWUsagePlan:
    Type: "AWS::ApiGateway::UsagePlan"
    Properties:
      ApiStages:
        - ApiId: !Ref SCIMProvisioningAPIGW
          Stage: !Ref SCIMAPIStage
      Description: SCIM API GW usage plan
      Quota:
        Limit: 5000
        Period: DAY
      Throttle:
        BurstLimit: 1000
        RateLimit: 500
      UsagePlanName: !Sub "${AWS::StackName}-usageplan"

  ################# Parameter Store to hold the API key for authorization #################

  APITokenKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the Amazon Connect SCIM API bearer token in Parameter Store.
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          # This is the default key policy AWS KMS applies when none is supplied:
          # it delegates authorization to IAM rather than granting anyone access
          # directly, and omitting it can leave the key unmanageable. The
          # principals that actually use the key are granted kms:Encrypt and
          # kms:Decrypt on it through their own role policies, below.
          #
          # For production, consider splitting this into a key-administrator
          # statement (kms:Create*, kms:Put*, kms:ScheduleKeyDeletion, ...) held by
          # a separate principal from the key users. See "Key policies in AWS KMS"
          # in the AWS KMS Developer Guide.
          - Sid: DelegateToIam
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  APITokenKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-scim-api-token"
      TargetKeyId: !Ref APITokenKey

  ################# Create policies and Roles for Lambda and API GW
  SCIMProvisioningAPIGWAnyAPIPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !GetAtt
        - SCIMProvisioningLambda
        - Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Join
        - ""
        - - "arn:"
          - !Ref "AWS::Partition"
          - ":execute-api:"
          - !Ref "AWS::Region"
          - ":"
          - !Ref "AWS::AccountId"
          - ":"
          - !Ref SCIMProvisioningAPIGW
          - /
          - !Ref >-
            SCIMAPIStage
          - /*/*

  SCIMAuthPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt SCIMAuthorizerLambda.Arn
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SCIMProvisioningAPIGW}/authorizers/${SCIMAuthorizer}"

  ############### Custom Resource for API Key Generation

  ApiKeyCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      Description: The custom Resource to create Api key and used by Lambda and authorizer.
      ApiLength: !Ref ApiKeyLength
      ServiceToken: !GetAtt APIKeyGenerationLambda.Arn

  ## Create role for Lambda function
  SCIMProvisioningLambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${AWS::StackName}-ProvisioningRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-ProvisioningPolicy"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action:
                  - "connect:CreateUser"
                  - "connect:DeleteUser"
                  - "connect:DescribeUser"
                  - "connect:ListRoutingProfiles"
                  - "connect:ListSecurityProfiles"
                  - "connect:ListUsers"
                  - "connect:SearchUsers"
                  - "connect:UpdateUserSecurityProfiles"
                Resource:
                  - !Join
                    - ""
                    - - "arn:"
                      - !Ref "AWS::Partition"
                      - ":connect:"
                      - !Ref "AWS::Region"
                      - ":"
                      - !Ref "AWS::AccountId"
                      - ":instance/"
                      - !Ref AmazonConnectInstanceId
                  - !Join
                    - ""
                    - - "arn:"
                      - !Ref "AWS::Partition"
                      - ":connect:"
                      - !Ref "AWS::Region"
                      - ":"
                      - !Ref "AWS::AccountId"
                      - ":instance/"
                      - !Ref AmazonConnectInstanceId
                      - "/security-profile/*"
                  - !Join
                    - ""
                    - - "arn:"
                      - !Ref "AWS::Partition"
                      - ":connect:"
                      - !Ref "AWS::Region"
                      - ":"
                      - !Ref "AWS::AccountId"
                      - ":instance/"
                      - !Ref AmazonConnectInstanceId
                      - "/routing-profile/*"
                  - !Join
                    - ""
                    - - "arn:"
                      - !Ref "AWS::Partition"
                      - ":connect:"
                      - !Ref "AWS::Region"
                      - ":"
                      - !Ref "AWS::AccountId"
                      - ":instance/"
                      - !Ref AmazonConnectInstanceId
                      - "/agent/*"
                Effect: Allow
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com

  SCIMAuthorizerLambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${AWS::StackName}-AuthorizerRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-AuthorizerPolicy"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action:
                  - "ssm:GetParameter"
                Resource: !Join
                  - ""
                  - - "arn:"
                    - !Ref AWS::Partition
                    - ":ssm:"
                    - !Ref AWS::Region
                    - ":"
                    - !Ref AWS::AccountId
                    - ":"
                    - "parameter/connect/scim-integration/api-token"
                Effect: Allow
              - Action:
                  - "kms:Decrypt"
                Resource: !GetAtt APITokenKey.Arn
                Effect: Allow
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
  SCIMProvisioningAPIGWCloudWatchRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - !Join
          - ""
          - - "arn:"
            - !Ref "AWS::Partition"
            - ":iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
  BasicLambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${AWS::StackName}-ApiKeyLambdaRole"
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-SsmPutPolicy"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Join
                  - ""
                  - - "arn:"
                    - !Ref AWS::Partition
                    - ":ssm:"
                    - !Ref AWS::Region
                    - ":"
                    - !Ref AWS::AccountId
                    - ":"
                    - "parameter/connect/scim-integration/api-token"
                Effect: Allow
              - Action:
                  - kms:Encrypt
                  - kms:Decrypt
                Resource: !GetAtt APITokenKey.Arn
                Effect: Allow
      ManagedPolicyArns:
        - !Join
          - ""
          - - "arn:"
            - !Ref "AWS::Partition"
            - ":iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com

Outputs:
  SCIMProvisioningOktaTenantURL:
    Condition: OktaCondition
    Description: "URL to enter in OKTA SCIM provisioning"
    Value: !Join
      - ""
      - - "https://"
        - !Ref SCIMProvisioningAPIGW
        - .execute-api.
        - !Ref "AWS::Region"
        - .
        - !Ref "AWS::URLSuffix"
        - /
        - !Ref >-
          SCIMAPIStage
        - /Users?filter=userName%20eq%20%22test.user
  SCIMProvisioningAzureTenantURL:
    Condition: AzureCondition
    Description: "URL to enter in Azure SCIM provisioning"
    Value: !Join
      - ""
      - - "https://"
        - !Ref SCIMProvisioningAPIGW
        - .execute-api.
        - !Ref "AWS::Region"
        - .
        - !Ref "AWS::URLSuffix"
        - /
        - !Ref >-
          SCIMAPIStage
        - /scim/
  IdPAPITokenSSMParameter:
    Description: The Parameter store that contains the IDP Authorization API Key
    Value: !Join
      - ""
      - - "arn:"
        - !Ref AWS::Partition
        - ":ssm:"
        - !Ref AWS::Region
        - ":"
        - !Ref AWS::AccountId
        - ":"
        - "parameter/connect/scim-integration/api-token"
